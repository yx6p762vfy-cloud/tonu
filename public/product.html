<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
  <link rel="icon" type="image/jpeg" href="TonuIcon.jpeg"/>
  <link rel="apple-touch-icon" href="TonuIcon.jpeg"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>tonú Privé — Annonces</title>
<link rel="stylesheet" href="shared.css"/>
<style>
/* ══════════════════════════════════════════
   PRODUCT PAGE — listing + detail (URL ?id=)
   ══════════════════════════════════════════ */

/* ── BREADCRUMB ── */
.breadcrumb{
  display:flex;align-items:center;gap:8px;
  padding:14px 24px;border-bottom:1px solid var(--line);
  background:var(--black);
}
.breadcrumb a,.breadcrumb span{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--grey2);
  text-decoration:none;transition:color .2s;cursor:pointer;
}
.breadcrumb a:hover{color:var(--gold3)}
.breadcrumb .sep{color:var(--black4);font-size:8px}
.breadcrumb .current{color:rgba(255,255,255,.72)}

/* ══════════════════════
   LISTING VIEW
══════════════════════ */
#listing-view{display:block}
#detail-view{display:none}

.listing-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--line);
  background:var(--black);gap:12px;flex-wrap:wrap;
}
.listing-title{
  font-family:var(--f-display);font-size:26px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--white);
}
.listing-count{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;
  color:var(--grey3);margin-left:8px;
}
.listing-filters{
  display:flex;align-items:center;gap:0;
}
.filter-btn{
  height:36px;padding:0 16px;
  background:transparent;border:1px solid var(--line-strong);
  border-right:none;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--grey3);cursor:pointer;transition:all .2s;
}
.filter-btn:last-child{border-right:1px solid var(--line-strong)}
.filter-btn:hover{background:rgba(255,255,255,.07);color:var(--white)}
.filter-btn.active{background:var(--grad);color:#fff;border-color:transparent}

/* Filter tags */
.filter-tags{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 24px;border-bottom:1px solid var(--line);
  background:var(--black);
}
.filter-tag{
  height:28px;padding:0 12px;
  border:1px solid var(--line-strong);
  background:transparent;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--grey3);cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
.filter-tag:hover{
  background:rgba(255,255,255,.08);color:var(--white);
  border-color:var(--grey2);
}
.filter-tag.active{
  background:var(--grad);color:#fff;border-color:transparent;
}

/* Listing grid */
.listing-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:0;
  background:transparent;
}
.listing-grid .pc{
  background:var(--black2);
  border:none;box-shadow:0 0 0 1px var(--line);
  padding:0 0 16px;
}
.listing-grid .pc:hover{border-color:var(--line);box-shadow:0 0 0 1px rgba(139,92,246,.65);z-index:2}
.listing-grid .empty-state{border:none;box-shadow:0 0 0 1px var(--line)}
.listing-grid .pc-info{padding:12px 12px 0}

/* ══════════════════════
   DETAIL VIEW
══════════════════════ */
.detail-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:calc(100vh - var(--total-nav) - 44px);
}

/* Visual column */
.dv-visual{
  position:sticky;top:var(--total-nav);
  height:calc(100vh - var(--total-nav));
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;
}
.dv-main{
  flex:1;position:relative;overflow:hidden;
  background:var(--black);
  display:flex;align-items:center;justify-content:center;
}
.dv-main img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .7s cubic-bezier(.16,1,.3,1);
}
.dv-main:hover img{transform:scale(1.04)}
.dv-cloth-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.dv-cloth{
  width:44%;height:62%;
  border-radius:52px 52px 16px 16px;
  box-shadow:0 28px 72px rgba(0,0,0,.75),inset 0 2px 0 rgba(255,255,255,.06);
  animation:dv-float 5s ease-in-out infinite;
}
@keyframes dv-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.dv-badge{
  position:absolute;top:20px;left:20px;z-index:3;
  background:var(--grad);color:#fff;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;padding:5px 12px;
}
/* Thumbnails strip */
.dv-thumbs{
  display:flex;border-top:1px solid var(--line);
  height:88px;flex-shrink:0;
}
.dv-thumb{
  flex:1;border-right:1px solid var(--line);
  overflow:hidden;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  position:relative;transition:background .2s;
  background:var(--black2);
}
.dv-thumb:last-child{border-right:none}
.dv-thumb:hover,.dv-thumb.active{background:var(--black3)}
.dv-thumb.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:2px;background:var(--grad);
}
.dv-thumb img{width:100%;height:100%;object-fit:cover}
.dv-thumb-cloth{
  width:42%;height:56%;
  border-radius:18px 18px 6px 6px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}

/* Info column */
.dv-info{
  padding:40px 44px;overflow-y:auto;
  background:var(--black);
}
.dv-brand{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold3);margin-bottom:8px;
}
.dv-name{
  font-family:var(--f-display);
  font-size:clamp(30px,3vw,46px);
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--white);line-height:.92;margin-bottom:16px;
}
.dv-rating{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;
}
.dv-stars{color:var(--gold2);font-size:12px;letter-spacing:2px}
.dv-reviews{font-family:var(--f-mono);font-size:10px;color:var(--grey3)}
.dv-price{
  font-family:var(--f-mono);font-size:13px;
  letter-spacing:.02em;color:var(--grey2);
  margin-bottom:16px;
}
.dv-desc{
  font-size:13px;line-height:2;color:rgba(255,255,255,.7);
  margin-bottom:28px;font-weight:300;
  padding-bottom:24px;border-bottom:1px solid var(--line);
}

/* Size */
.dv-size-label{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grey3);
  margin-bottom:12px;
}
.dv-size-guide{color:var(--gold3);cursor:pointer;text-decoration:underline}
.dv-sizes{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:24px}
.size-btn{
  min-width:46px;height:46px;
  border:1px solid var(--line-strong);
  background:transparent;color:rgba(255,255,255,.7);
  font-family:var(--f-mono);font-size:11px;font-weight:400;
  cursor:pointer;transition:all .2s;padding:0 10px;
}
.size-btn:hover{border-color:var(--grey1);color:var(--white)}
.size-btn.sel{background:var(--grad);color:#fff;border-color:transparent}
.size-btn.oos{opacity:.25;pointer-events:none;text-decoration:line-through}

/* Qty */
.dv-qty-row{
  display:flex;align-items:center;gap:16px;margin-bottom:20px;
}
.dv-qty-label{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grey3);
}
.qty-ctrl{display:flex;align-items:center;border:1px solid var(--line-strong)}
.qty-btn{
  width:40px;height:40px;background:transparent;border:none;
  color:var(--white);font-size:16px;cursor:pointer;transition:background .2s;
}
.qty-btn:hover{background:rgba(255,255,255,.08)}
.qty-val{
  width:40px;text-align:center;
  font-family:var(--f-mono);font-size:13px;color:var(--white);
}

/* CTA buttons */
.dv-cta{display:flex;gap:8px;margin-bottom:16px}
.btn-wish{
  width:52px;height:52px;flex-shrink:0;
  border:1px solid var(--line-strong);background:transparent;
  color:var(--grey2);font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;
}
.btn-wish:hover,.btn-wish.active{border-color:var(--gold);color:var(--gold2)}

/* Delivery info */
.dv-delivery{
  display:flex;flex-direction:column;gap:8px;
  padding:16px;background:var(--black3);
  border:1px solid var(--black4);margin-bottom:24px;
}
.dv-del-item{
  display:flex;align-items:center;gap:10px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  color:rgba(255,255,255,.68);
}
.dv-del-item svg{flex-shrink:0;color:var(--gold2)}

/* Accordion */
.dv-accordion{border-top:1px solid var(--line);margin-top:8px}
.acc-item{border-bottom:1px solid var(--line)}
.acc-head{
  width:100%;background:none;border:none;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 0;cursor:pointer;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(255,255,255,.66);transition:color .2s;
}
.acc-head:hover{color:var(--white)}
.acc-head.open{color:var(--gold3)}
.acc-arrow{font-size:10px;color:var(--gold2);transition:transform .25s}
.acc-head.open .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc-body.open{max-height:240px}
.acc-body p{
  font-size:12px;line-height:2;color:rgba(255,255,255,.68);
  padding-bottom:16px;font-weight:300;
}

/* Comments section */
.comments-section{
  padding:32px 44px;border-top:1px solid var(--black4);
  background:var(--black2);
}
.comments-header{
  font-family:var(--f-display);font-size:24px;
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--white);margin-bottom:20px;
}
.comments-list{
  display:flex;flex-direction:column;gap:16px;
  margin-bottom:24px;
}
.comment-item{
  padding:16px 20px;background:var(--black);
  border:1px solid var(--black4);
}
.comment-header{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:8px;
}
.comment-author{
  font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;
  color:var(--gold3);font-weight:500;
}
.comment-date{
  font-family:var(--f-mono);font-size:9px;color:var(--grey2);
}
.comment-body{
  font-size:13px;line-height:1.7;color:var(--grey3);
}
.comment-form{
  display:flex;flex-direction:column;gap:12px;
}
.comment-textarea{
  background:var(--black);border:1px solid var(--black4);
  padding:14px;font-family:var(--f-body);font-size:13px;
  color:var(--white);min-height:80px;resize:vertical;
  outline:none;transition:border-color .2s,box-shadow .2s;
}
.comment-textarea:focus{border-color:var(--gold);box-shadow:0 0 0 1px rgba(139,92,246,.35)}
.comment-textarea::placeholder{color:var(--grey2);opacity:.85}
.comment-submit{
  align-self:flex-start;
}
.comment-login-hint{
  padding:20px;background:var(--black3);
  border:1px solid var(--black4);
  font-size:12px;color:var(--grey3);
  text-align:center;
}

/* Related */
.related-section{
  padding:48px 0;border-top:1px solid var(--black4);
  background:var(--black2);
}
.related-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:0;background:transparent;
}
.related-grid .pc{
  background:var(--black2);border:none;
  box-shadow:0 0 0 1px var(--line);
  padding:0 0 16px;
}
.related-grid .pc:hover{border-color:var(--line);box-shadow:0 0 0 1px rgba(139,92,246,.65);z-index:2}
.related-grid .empty-state{border:none;box-shadow:0 0 0 1px var(--line)}
.related-grid .pc-info{padding:12px 12px 0}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  .listing-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .listing-header{padding:14px 12px}
  .listing-filters{display:none}
  .filter-tags{padding:10px 12px}
  .listing-grid{grid-template-columns:repeat(2,1fr);padding:1px}
  .breadcrumb{padding:10px 12px}

  .detail-layout{grid-template-columns:1fr}
  .dv-visual{position:relative;top:auto;height:auto}
  .dv-main{aspect-ratio:3/4;height:auto}
  .dv-info{padding:28px 16px}
  .dv-name{font-size:clamp(28px,7vw,40px)}
  .dv-price{font-size:12px}
  .related-grid{grid-template-columns:repeat(2,1fr)}
  .related-section{padding:32px 0}
}
@media(max-width:480px){
  .listing-grid{grid-template-columns:repeat(2,1fr)}
  .filter-tags{gap:4px}
  .filter-tag{font-size:8.5px;padding:0 10px}
}
</style>
</head>
<body>
<div id="nav-root"></div>

<!-- BREADCRUMB -->
<div class="breadcrumb" id="breadcrumb">
  <a href="index.html">Accueil</a>
  <span class="sep">›</span>
  <span class="current" id="breadCurrent">Annonces</span>
</div>

<!-- ══ LISTING VIEW ══ -->
<div id="listing-view">
  <div class="listing-header">
    <div>
      <span class="listing-title">Annonces</span>
      <span class="listing-count" id="listCount">— chargement…</span>
    </div>
    <div class="listing-filters">
      <button class="filter-btn active" data-sort="recent" onclick="setSort('recent',this)">Récentes</button>
      <button class="filter-btn" data-sort="city" onclick="setSort('city',this)">Ville A→Z</button>
    </div>
  </div>
  <div class="listing-toolbar">
    <form class="search-bar" id="search-form">
      <input type="search" id="filter-q" placeholder="Rechercher un titre, une ville, un mot-clé…" aria-label="Rechercher"/>
      <button type="submit">Rechercher</button>
    </form>
    <input type="search" class="toolbar-select" id="filter-city" placeholder="Ville" aria-label="Filtrer par ville"/>
    <select class="toolbar-select" id="filter-gender" aria-label="Filtrer par genre">
      <option value="">Tous les profils</option>
      <option value="Femme">Femmes</option>
      <option value="Homme">Hommes</option>
      <option value="Couple">Couples</option>
      <option value="Autre">Autres</option>
    </select>
    <select class="toolbar-select" id="filter-sort" aria-label="Trier">
      <option value="recent">Plus récentes</option>
      <option value="old">Plus anciennes</option>
      <option value="city">Ville A→Z</option>
      <option value="comments">Plus commentées</option>
    </select>
  </div>
  <div class="filter-tags" id="cat-tags">
    <button class="filter-tag active" data-cat="" onclick="setCat('',this)">Tous</button>
    <button class="filter-tag" data-cat="Rencontre" onclick="setCat('Rencontre',this)">Rencontres</button>
    <button class="filter-tag" data-cat="Sortie" onclick="setCat('Sortie',this)">Sorties</button>
    <button class="filter-tag" data-cat="Discussion" onclick="setCat('Discussion',this)">Discussion</button>
    <button class="filter-tag" data-cat="Couple" onclick="setCat('Couple',this)">Couples</button>
    <button class="filter-tag" data-cat="Escorte" onclick="setCat('Escorte',this)">Escortes</button>
  </div>
  <div class="listing-grid" id="listing-grid"></div>
  <div class="load-more-wrap" id="load-more-wrap" style="display:none">
    <button type="button" class="btn btn-secondary" id="load-more" onclick="loadMore()"><span>Charger plus d’annonces</span></button>
  </div>
</div>

<!-- ══ DETAIL VIEW ══ -->
<div id="detail-view">
  <div class="detail-layout">
    <!-- Visual -->
    <div class="dv-visual">
      <div class="dv-main" id="dv-main">
        <img id="dv-main-img" src="" alt="" style="display:none"/>
        <div class="dv-cloth-wrap">
          <div class="dv-cloth" id="dv-cloth"></div>
        </div>
        <div class="dv-badge" id="dv-badge" style="display:none"></div>
      </div>
      <div class="dv-thumbs" id="dv-thumbs"></div>
    </div>

    <!-- Info -->
    <div class="dv-info">
      <div id="detail-notice" style="display:none"></div>
      <div class="dv-brand" id="dv-brand"></div>
      <h1 class="dv-name" id="dv-name"></h1>
      <div class="dv-price" id="dv-price"></div>
      <p class="dv-desc" id="dv-desc"></p>

      <div class="dv-sizes" id="dv-tags" style="margin-bottom:22px"></div>

      <div id="owner-actions" style="display:none;margin-bottom:16px;gap:8px;flex-wrap:wrap">
        <a class="btn btn-secondary btn-sm" id="owner-edit"><span>Modifier</span></a>
        <button type="button" class="btn btn-secondary btn-sm" id="owner-delete"><span>Supprimer</span></button>
      </div>

      <div class="dv-cta">
        <button class="btn btn-primary btn-full btn-lg" id="btn-comment" type="button"><span>Laisser un commentaire</span></button>
      </div>
      <button type="button" class="btn btn-outline-gold btn-full" id="btn-report" style="display:none;margin-bottom:24px"><span>Signaler cette annonce</span></button>

      <div class="dv-delivery">
        <div class="dv-del-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Profil majeur (18+) · annonce modérée avant publication
        </div>
        <div class="dv-del-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>
          <span id="dv-location"></span>
        </div>
        <div class="dv-del-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
          Un problème ? Utilisez « Signaler » — la modération examine chaque signalement.
        </div>
      </div>
    </div>
  </div>

  <!-- COMMENTS -->
  <section class="comments-section" id="comments-section">
    <h2 class="comments-header" id="comments-title">Commentaires</h2>
    <div class="comments-list" id="comments-list"></div>
    <div id="comment-form-container"></div>
  </section>

  <!-- RELATED -->
  <section class="related-section">
    <div style="padding:0 24px">
      <div class="section-title-bar">
        <h2>Annonces similaires</h2>
        <a href="product.html" class="see-all">Tout voir</a>
      </div>
    </div>
    <div style="padding:0 24px">
      <div class="related-grid" id="related-grid"></div>
    </div>
  </section>
</div>

<div id="footer-root"></div>

<script src="api.js"></script>
<script src="shared.js"></script>
<script>
document.getElementById('nav-root').innerHTML = buildNavHTML({ activePage: 'annonces' });
document.getElementById('footer-root').innerHTML = buildFooterHTML();
initShared();

const params = new URLSearchParams(location.search);
const pid = params.get('id');
const CATEGORIES = ['Rencontre', 'Sortie', 'Discussion', 'Couple', 'Escorte'];
const GENDERS = ['Femme', 'Homme', 'Couple', 'Autre'];
const SORTS = ['recent', 'old', 'city', 'comments'];

const state = { cat: '', q: '', city: '', gender: '', sort: 'recent', page: 1, limit: 12, total: 0, pages: 1, loaded: 0, loading: false };
let currentAnnonce = null;

function readStateFromUrl() {
  const cat = params.get('cat') || '';
  state.cat = CATEGORIES.find((c) => c.toLowerCase() === cat.toLowerCase()) || '';
  state.q = (params.get('q') || '').slice(0, 80);
  state.city = (params.get('city') || '').slice(0, 60);
  const gender = params.get('gender') || '';
  state.gender = GENDERS.find((g) => g.toLowerCase() === gender.toLowerCase()) || '';
  const sort = params.get('sort') || 'recent';
  state.sort = SORTS.includes(sort) ? sort : 'recent';
  syncControls();
}

function syncControls() {
  document.getElementById('filter-q').value = state.q;
  document.getElementById('filter-city').value = state.city;
  document.getElementById('filter-gender').value = state.gender;
  document.getElementById('filter-sort').value = state.sort;
  document.querySelectorAll('.filter-tag').forEach((btn) => {
    btn.classList.toggle('active', (btn.dataset.cat || '') === state.cat);
  });
  document.querySelectorAll('.filter-btn').forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.sort === state.sort);
  });
}

function syncUrl() {
  const query = new URLSearchParams();
  if (state.cat) query.set('cat', state.cat);
  if (state.q) query.set('q', state.q);
  if (state.city) query.set('city', state.city);
  if (state.gender) query.set('gender', state.gender);
  if (state.sort !== 'recent') query.set('sort', state.sort);
  const qs = query.toString();
  history.replaceState(null, '', `product.html${qs ? `?${qs}` : ''}`);
}

function setCat(cat) {
  state.cat = cat;
  state.page = 1;
  syncControls();
  syncUrl();
  loadListing(true);
}

function setSort(sort) {
  state.sort = sort;
  state.page = 1;
  syncControls();
  syncUrl();
  loadListing(true);
}

function applyToolbar() {
  state.q = document.getElementById('filter-q').value.trim();
  state.city = document.getElementById('filter-city').value.trim();
  state.gender = document.getElementById('filter-gender').value;
  state.sort = document.getElementById('filter-sort').value;
  state.page = 1;
  syncUrl();
  loadListing(true);
}

function showSkeleton(n = 12) {
  const grid = document.getElementById('listing-grid');
  document.getElementById('listCount').textContent = '— chargement…';
  grid.innerHTML = Array.from({ length: n }).map(() => `
    <div class="pc" style="pointer-events:none">
      <div class="pc-img" style="background:linear-gradient(90deg,var(--black3) 25%,rgba(255,255,255,.12) 50%,var(--black3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite"></div>
      <div class="pc-info">
        <div style="height:10px;background:var(--black3);margin-bottom:8px;width:60%;border-radius:2px;animation:shimmer 1.4s infinite"></div>
        <div style="height:14px;background:var(--black3);margin-bottom:6px;border-radius:2px;animation:shimmer 1.4s infinite"></div>
        <div style="height:10px;background:rgba(255,255,255,.1);width:80%;border-radius:2px;animation:shimmer 1.4s infinite"></div>
      </div>
    </div>`).join('');
}

async function loadListing(reset = true) {
  if (state.loading) return;
  state.loading = true;
  if (reset) {
    state.page = 1;
    state.loaded = 0;
    showSkeleton();
  }

  const loadMoreBtn = document.getElementById('load-more');
  if (loadMoreBtn) loadMoreBtn.disabled = true;

  try {
    const data = await API.listAnnonces({
      cat: state.cat,
      q: state.q,
      city: state.city,
      gender: state.gender,
      sort: state.sort,
      page: state.page,
      limit: state.limit,
    });

    const grid = document.getElementById('listing-grid');
    const cards = data.annonces.map((a, i) => renderAnnonceCard(a, state.loaded + i)).join('');

    if (reset) {
      grid.innerHTML = cards || renderEmptyState('Aucune annonce ne correspond à votre recherche.', { colspan: 4 });
    } else if (cards) {
      grid.insertAdjacentHTML('beforeend', cards);
    }

    state.total = data.pagination.total;
    state.pages = data.pagination.pages || 1;
    state.loaded += data.annonces.length;

    document.getElementById('listCount').textContent =
      `— ${state.total} annonce${state.total > 1 ? 's' : ''}`;
    document.getElementById('load-more-wrap').style.display = state.page < state.pages ? 'flex' : 'none';
    initReveal();
  } catch (err) {
    if (reset) {
      document.getElementById('listing-grid').innerHTML =
        renderEmptyState('Impossible de charger les annonces. Vérifiez votre connexion puis réessayez.', { colspan: 4 });
      document.getElementById('listCount').textContent = '— erreur';
    }
    showToast(err.message || 'Erreur de chargement', 'error');
  } finally {
    state.loading = false;
    if (loadMoreBtn) loadMoreBtn.disabled = false;
  }
}

function loadMore() {
  if (state.loading || state.page >= state.pages) return;
  state.page += 1;
  loadListing(false);
}

async function showDetail(id) {
  document.getElementById('listing-view').style.display = 'none';
  document.getElementById('detail-view').style.display = 'block';
  try {
    const { annonce } = await API.getAnnonce(id);
    renderDetail(annonce);
  } catch (err) {
    showToast(err.message || 'Annonce introuvable', 'error');
    setTimeout(() => { window.location.href = 'product.html'; }, 1400);
  }
}

function renderDetail(a) {
  currentAnnonce = a;
  document.title = `${a.title} — ${SITE.name}`;
  document.getElementById('breadCurrent').textContent = a.title;

  const user = AUTH.currentUser();
  const isOwner = !!user && user.id === a.authorId;
  const isStaff = AUTH.isStaff();
  const notice = document.getElementById('detail-notice');

  if (a.status === 'pending') {
    notice.style.display = 'block';
    notice.className = 'notice warn';
    notice.textContent = isOwner
      ? 'Cette annonce est en attente de modération. Elle n’est visible que par vous et l’équipe de modération.'
      : 'Annonce en attente de modération — visible uniquement par son auteur et l’équipe.';
  } else if (a.status === 'rejected') {
    notice.style.display = 'block';
    notice.className = 'notice error';
    notice.textContent = `Annonce refusée. Motif : ${a.rejectionReason || 'non précisé'}.${isOwner ? ' Modifiez-la pour la soumettre à nouveau.' : ''}`;
  } else {
    notice.style.display = 'none';
  }

  const photos = (a.photos || []).filter(Boolean);
  const mainSrc = photos[0] || a.image || '';
  const mainImg = document.getElementById('dv-main-img');
  const cloth = document.getElementById('dv-cloth');
  const mainEl = document.getElementById('dv-main');

  if (mainSrc) {
    mainImg.src = mainSrc;
    mainImg.alt = a.title;
    mainImg.style.display = 'block';
    cloth.parentElement.style.display = 'none';
    mainEl.style.background = 'var(--black)';
  } else {
    mainImg.style.display = 'none';
    cloth.parentElement.style.display = 'flex';
    cloth.style.background = CLOTH_COLORS[0];
    mainEl.style.background = BG_GRADS[0];
  }

  const badge = document.getElementById('dv-badge');
  badge.textContent = a.category || 'Annonce';
  badge.style.display = 'block';

  const thumbs = document.getElementById('dv-thumbs');
  if (photos.length > 1) {
    thumbs.innerHTML = photos.map((src, i) => `
      <div class="dv-thumb ${i === 0 ? 'active' : ''}" data-photo="${i}" role="button" tabindex="0" aria-label="Photo ${i + 1}">
        <img src="${esc(src)}" alt=""/>
      </div>`).join('');
    thumbs.querySelectorAll('[data-photo]').forEach((thumb) => {
      const update = () => {
        thumbs.querySelectorAll('.dv-thumb').forEach((t) => t.classList.remove('active'));
        thumb.classList.add('active');
        mainImg.src = photos[Number(thumb.dataset.photo)];
        mainImg.style.display = 'block';
        cloth.parentElement.style.display = 'none';
      };
      thumb.addEventListener('click', update);
      thumb.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); update(); }
      });
    });
  } else {
    thumbs.innerHTML = '';
  }

  const identity = [`${a.pseudo}`, a.age ? `${a.age} ans` : null, a.gender && a.gender !== '—' ? a.gender : null].filter(Boolean);
  document.getElementById('dv-brand').textContent = identity.join(' · ');
  document.getElementById('dv-name').textContent = a.title;
  document.getElementById('dv-price').textContent =
    `${a.intention || a.category} · Publié le ${formatDate(a.createdAt)}${a.commentCount ? ` · ${a.commentCount} commentaire${a.commentCount > 1 ? 's' : ''}` : ''}`;
  document.getElementById('dv-desc').textContent = a.desc;
  document.getElementById('dv-location').textContent = a.city || 'Ville non précisée';

  document.getElementById('dv-tags').innerHTML = [a.city, a.category, a.intention]
    .filter(Boolean)
    .map((tag) => `<span class="pc-meta">${esc(tag)}</span>`)
    .join('');

  const ownerActions = document.getElementById('owner-actions');
  ownerActions.style.display = isOwner ? 'flex' : 'none';
  if (isOwner) {
    document.getElementById('owner-edit').href = `publier.html?edit=${encodeURIComponent(a.id)}`;
    document.getElementById('owner-delete').onclick = async () => {
      const ok = await confirmDialog('Supprimer définitivement cette annonce et ses photos ?', {
        title: 'Supprimer l’annonce',
        confirmLabel: 'Supprimer',
        danger: true,
      });
      if (!ok) return;
      try {
        await API.deleteAnnonce(a.id);
        showToast('Annonce supprimée');
        setTimeout(() => { window.location.href = 'publier.html'; }, 600);
      } catch (err) {
        showToast(err.message || 'Suppression impossible', 'error');
      }
    };
  }

  const commentBtn = document.getElementById('btn-comment');
  commentBtn.querySelector('span').textContent = AUTH.isLoggedIn() ? 'Laisser un commentaire' : 'Se connecter pour commenter';
  commentBtn.onclick = scrollToComments;

  const reportBtn = document.getElementById('btn-report');
  const canReport = !isOwner && a.status === 'approved';
  reportBtn.style.display = canReport ? 'inline-flex' : 'none';
  reportBtn.onclick = () => openReportDialog({ annonceId: a.id });

  loadComments(a);
  loadRelated(a);
}

function scrollToComments() {
  if (!AUTH.isLoggedIn()) {
    window.location.href = loginUrl(currentPath());
    return;
  }
  document.getElementById('comments-section').scrollIntoView({ behavior: 'smooth' });
  setTimeout(() => document.getElementById('comment-text')?.focus(), 450);
}

async function loadComments(a) {
  const list = document.getElementById('comments-list');
  const formContainer = document.getElementById('comment-form-container');
  const title = document.getElementById('comments-title');
  list.innerHTML = '<p class="comment-login-hint">Chargement des commentaires…</p>';

  try {
    const { comments } = await API.listComments(a.id);
    title.textContent = `Commentaires${comments.length ? ` (${comments.length})` : ''}`;

    if (!comments.length) {
      list.innerHTML = '<p class="comment-login-hint">Aucun commentaire pour le moment. Soyez la première personne à réagir.</p>';
    } else {
      list.innerHTML = comments.map((c) => `
        <div class="comment-item">
          <div class="comment-header">
            <span class="comment-author">${esc(c.user.pseudo)}${c.user.age ? ` · ${esc(c.user.age)} ans` : ''}</span>
            <span class="comment-date">${esc(formatDate(c.createdAt))}</span>
          </div>
          <div class="comment-body">${esc(c.content)}</div>
          <div class="comment-actions">
            ${c.canDelete ? `<button type="button" class="btn btn-sm btn-secondary" data-delete-comment="${esc(c.id)}"><span>Supprimer</span></button>` : ''}
            ${AUTH.isLoggedIn() && !c.isOwner ? `<button type="button" class="comment-report" data-report-comment="${esc(c.id)}">Signaler</button>` : ''}
          </div>
        </div>`).join('');

      list.querySelectorAll('[data-delete-comment]').forEach((btn) => {
        btn.addEventListener('click', () => deleteComment(a.id, btn.dataset.deleteComment));
      });
      list.querySelectorAll('[data-report-comment]').forEach((btn) => {
        btn.addEventListener('click', () => openReportDialog({ annonceId: a.id, commentId: btn.dataset.reportComment }));
      });
    }

    if (AUTH.isLoggedIn()) {
      formContainer.innerHTML = `
        <form class="comment-form" id="comment-form">
          <label class="field" style="margin:0">
            <span class="form-sub" style="margin:0;font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase">Votre commentaire</span>
            <textarea class="comment-textarea" id="comment-text" placeholder="Écrire un commentaire public et respectueux…" maxlength="500" required></textarea>
          </label>
          <button type="submit" class="btn btn-primary comment-submit"><span>Publier le commentaire</span></button>
        </form>`;
      document.getElementById('comment-form').addEventListener('submit', (e) => submitComment(e, a.id));
    } else {
      formContainer.innerHTML = `
        <div class="comment-login-hint">
          <p style="margin-bottom:10px">Un compte est nécessaire pour commenter.</p>
          <a href="${esc(loginUrl(currentPath()))}" class="btn btn-secondary btn-sm"><span>Se connecter / créer un compte</span></a>
        </div>`;
    }
  } catch (err) {
    list.innerHTML = `<p class="comment-login-hint">${esc(err.message || 'Impossible de charger les commentaires.')}</p>`;
    formContainer.innerHTML = '';
  }
}

async function submitComment(e, annonceId) {
  e.preventDefault();
  const input = document.getElementById('comment-text');
  const content = input.value.trim();
  if (!content) return;
  const button = e.target.querySelector('button[type="submit"]');
  button.disabled = true;
  try {
    await API.createComment(annonceId, content);
    showToast('Commentaire publié');
    await loadComments({ id: annonceId });
  } catch (err) {
    showToast(err.message || 'Commentaire impossible', 'error');
    button.disabled = false;
  }
}

async function deleteComment(annonceId, commentId) {
  const ok = await confirmDialog('Supprimer ce commentaire ?', {
    title: 'Supprimer le commentaire',
    confirmLabel: 'Supprimer',
    danger: true,
  });
  if (!ok) return;
  try {
    await API.deleteComment(annonceId, commentId);
    showToast('Commentaire supprimé');
    await loadComments({ id: annonceId });
  } catch (err) {
    showToast(err.message || 'Suppression impossible', 'error');
  }
}

function openReportDialog({ annonceId, commentId }) {
  if (!AUTH.isLoggedIn()) {
    showToast('Connecte-toi pour signaler un contenu', 'error');
    setTimeout(() => { window.location.href = loginUrl(currentPath()); }, 600);
    return;
  }

  const { body, close } = modalShell('Signaler ce contenu');
  body.innerHTML = `
    <form class="modal-form">
      <div class="field">
        <label>Motif du signalement</label>
        <select name="reason" required>
          <option value="">Choisir un motif…</option>
          <option value="contenu_illegal">Contenu illégal</option>
          <option value="mineur">Personne mineure</option>
          <option value="arnaque">Arnaque / fraude</option>
          <option value="harcelement">Harcèlement</option>
          <option value="spam">Spam / publicité</option>
          <option value="autre">Autre</option>
        </select>
      </div>
      <div class="field">
        <label>Détails (optionnel)</label>
        <textarea name="details" maxlength="1000" placeholder="Expliquez brièvement ce qui pose problème…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="report-cancel"><span>Annuler</span></button>
        <button type="submit" class="btn btn-primary"><span>Envoyer le signalement</span></button>
      </div>
    </form>`;

  body.querySelector('#report-cancel').addEventListener('click', close);
  body.querySelector('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    const reason = form.reason.value;
    const details = form.details.value.trim();
    if (!reason) return;
    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    try {
      await API.reportContent({ annonceId, commentId, reason, details });
      close();
      showToast('Signalement transmis à la modération');
    } catch (err) {
      showToast(err.message || 'Signalement impossible', 'error');
      button.disabled = false;
    }
  });
}

async function loadRelated(a) {
  const grid = document.getElementById('related-grid');
  grid.innerHTML = renderEmptyState('Chargement…', { colspan: 4 });
  try {
    let { annonces } = await API.listAnnonces({ cat: a.category, limit: 5 });
    let related = annonces.filter((item) => item.id !== a.id).slice(0, 4);
    if (!related.length) {
      const fallback = await API.listAnnonces({ limit: 5 });
      related = fallback.annonces.filter((item) => item.id !== a.id).slice(0, 4);
    }
    grid.innerHTML = related.length
      ? related.map((item, i) => renderAnnonceCard(item, i)).join('')
      : renderEmptyState('Aucune autre annonce pour le moment.', { colspan: 4 });
    initReveal();
  } catch {
    grid.innerHTML = renderEmptyState('Annonces similaires indisponibles.', { colspan: 4 });
  }
}

document.getElementById('search-form').addEventListener('submit', (e) => {
  e.preventDefault();
  applyToolbar();
});
document.getElementById('filter-gender').addEventListener('change', applyToolbar);
document.getElementById('filter-sort').addEventListener('change', applyToolbar);
document.getElementById('filter-city').addEventListener('change', applyToolbar);
document.getElementById('filter-city').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); applyToolbar(); }
});

async function initPage() {
  await AUTH.refresh();
  AUTH.updateNavLabel();

  if (pid) {
    await showDetail(pid);
  } else {
    readStateFromUrl();
    await loadListing(true);
  }
}

initPage();
</script>
</body>
