<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
  <link rel="icon" type="image/jpeg" href="TonuIcon.jpeg"/>
  <link rel="apple-touch-icon" href="TonuIcon.jpeg"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>tonú Privé — Annonces</title>
<link rel="stylesheet" href="shared.css"/>
<style>
/* ══════════════════════════════════════════
   PRODUCT PAGE — listing + detail (URL ?id=)
   ══════════════════════════════════════════ */

/* ── BREADCRUMB ── */
.breadcrumb{
  display:flex;align-items:center;gap:8px;
  padding:14px 24px;border-bottom:1px solid var(--black3);
  background:var(--black);
}
.breadcrumb a,.breadcrumb span{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--grey2);
  text-decoration:none;transition:color .2s;cursor:none;
}
.breadcrumb a:hover{color:var(--gold)}
.breadcrumb .sep{color:var(--black4);font-size:8px}
.breadcrumb .current{color:rgba(0,0,0,.55)}

/* ══════════════════════
   LISTING VIEW
══════════════════════ */
#listing-view{display:block}
#detail-view{display:none}

.listing-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;border-bottom:1px solid var(--black3);
  background:var(--black);gap:12px;flex-wrap:wrap;
}
.listing-title{
  font-family:var(--f-display);font-size:26px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--white);
}
.listing-count{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;
  color:var(--grey3);margin-left:8px;
}
.listing-filters{
  display:flex;align-items:center;gap:0;
}
.filter-btn{
  height:36px;padding:0 16px;
  background:transparent;border:1px solid var(--black3);
  border-right:none;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--grey3);cursor:none;transition:all .2s;
}
.filter-btn:last-child{border-right:1px solid var(--black3)}
.filter-btn:hover,.filter-btn.active{background:var(--black3);color:var(--white)}

/* Filter tags */
.filter-tags{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:12px 24px;border-bottom:1px solid var(--black3);
  background:var(--black);
}
.filter-tag{
  height:28px;padding:0 12px;
  border:1px solid var(--black3);
  background:transparent;
  font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--grey3);cursor:none;transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
.filter-tag:hover,.filter-tag.active{
  background:var(--black3);color:var(--white);
  border-color:var(--grey2);
}
.filter-tag.active{
  background:var(--gold);color:var(--black);border-color:var(--gold);
}

/* Listing grid */
.listing-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:2px;
  background:var(--black3);
  border-bottom:1px solid var(--black3);
  padding:2px;
}
.listing-grid .pc{
  background:var(--black2);
  border:none;padding:0 0 16px;
}
.listing-grid .pc-info{padding:12px 12px 0}

/* ══════════════════════
   DETAIL VIEW
══════════════════════ */
.detail-layout{
  display:grid;
  grid-template-columns:1fr 1fr;
  min-height:calc(100vh - var(--total-nav) - 44px);
}

/* Visual column */
.dv-visual{
  position:sticky;top:var(--total-nav);
  height:calc(100vh - var(--total-nav));
  border-right:1px solid var(--black3);
  display:flex;flex-direction:column;
}
.dv-main{
  flex:1;position:relative;overflow:hidden;
  background:var(--black);
  display:flex;align-items:center;justify-content:center;
}
.dv-main img{
  width:100%;height:100%;object-fit:cover;display:block;
  transition:transform .7s cubic-bezier(.16,1,.3,1);
}
.dv-main:hover img{transform:scale(1.04)}
.dv-cloth-wrap{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
}
.dv-cloth{
  width:44%;height:62%;
  border-radius:52px 52px 16px 16px;
  box-shadow:0 28px 72px rgba(0,0,0,.75),inset 0 2px 0 rgba(255,255,255,.06);
  animation:dv-float 5s ease-in-out infinite;
}
@keyframes dv-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.dv-badge{
  position:absolute;top:20px;left:20px;z-index:3;
  background:var(--gold);color:var(--black);
  font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;padding:5px 12px;
}
/* Thumbnails strip */
.dv-thumbs{
  display:flex;border-top:1px solid var(--black3);
  height:88px;flex-shrink:0;
}
.dv-thumb{
  flex:1;border-right:1px solid var(--black3);
  overflow:hidden;cursor:none;
  display:flex;align-items:center;justify-content:center;
  position:relative;transition:background .2s;
  background:var(--black2);
}
.dv-thumb:last-child{border-right:none}
.dv-thumb:hover,.dv-thumb.active{background:var(--black3)}
.dv-thumb.active::after{
  content:'';position:absolute;bottom:0;left:0;right:0;
  height:2px;background:var(--gold);
}
.dv-thumb img{width:100%;height:100%;object-fit:cover}
.dv-thumb-cloth{
  width:42%;height:56%;
  border-radius:18px 18px 6px 6px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);
}

/* Info column */
.dv-info{
  padding:40px 44px;overflow-y:auto;
  background:var(--black);
}
.dv-brand{
  font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--gold);margin-bottom:8px;
}
.dv-name{
  font-family:var(--f-display);
  font-size:clamp(30px,3vw,46px);
  letter-spacing:.04em;text-transform:uppercase;
  color:var(--white);line-height:.92;margin-bottom:16px;
}
.dv-rating{
  display:flex;align-items:center;gap:10px;margin-bottom:20px;
}
.dv-stars{color:var(--gold);font-size:12px;letter-spacing:2px}
.dv-reviews{font-family:var(--f-mono);font-size:10px;color:var(--grey3)}
.dv-price{
  font-family:var(--f-display);font-size:40px;
  letter-spacing:.04em;color:var(--gold);
  margin-bottom:24px;
}
.dv-desc{
  font-size:13px;line-height:2;color:rgba(0,0,0,.55);
  margin-bottom:28px;font-weight:300;
  padding-bottom:24px;border-bottom:1px solid var(--black3);
}

/* Size */
.dv-size-label{
  display:flex;justify-content:space-between;align-items:center;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grey3);
  margin-bottom:12px;
}
.dv-size-guide{color:var(--gold);cursor:none;text-decoration:underline}
.dv-sizes{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:24px}
.size-btn{
  min-width:46px;height:46px;
  border:1px solid var(--black3);
  background:transparent;color:rgba(0,0,0,.55);
  font-family:var(--f-mono);font-size:11px;font-weight:400;
  cursor:none;transition:all .2s;padding:0 10px;
}
.size-btn:hover{border-color:var(--grey2);color:var(--white)}
.size-btn.sel{background:var(--white);color:var(--black);border-color:var(--white)}
.size-btn.oos{opacity:.25;pointer-events:none;text-decoration:line-through}

/* Qty */
.dv-qty-row{
  display:flex;align-items:center;gap:16px;margin-bottom:20px;
}
.dv-qty-label{
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--grey3);
}
.qty-ctrl{display:flex;align-items:center;border:1px solid var(--black3)}
.qty-btn{
  width:40px;height:40px;background:transparent;border:none;
  color:var(--white);font-size:16px;cursor:none;transition:background .2s;
}
.qty-btn:hover{background:var(--black3)}
.qty-val{
  width:40px;text-align:center;
  font-family:var(--f-mono);font-size:13px;color:var(--white);
}

/* CTA buttons */
.dv-cta{display:flex;gap:8px;margin-bottom:16px}
.btn-wish{
  width:52px;height:52px;flex-shrink:0;
  border:1px solid var(--black3);background:transparent;
  color:var(--grey2);font-size:18px;cursor:none;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s;
}
.btn-wish:hover,.btn-wish.active{border-color:var(--gold);color:var(--gold)}

/* Delivery info */
.dv-delivery{
  display:flex;flex-direction:column;gap:8px;
  padding:16px;background:var(--black3);
  border:1px solid var(--black4);margin-bottom:24px;
}
.dv-del-item{
  display:flex;align-items:center;gap:10px;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;
  color:rgba(0,0,0,.45);
}
.dv-del-item svg{flex-shrink:0;color:var(--gold)}

/* Accordion */
.dv-accordion{border-top:1px solid var(--black3);margin-top:8px}
.acc-item{border-bottom:1px solid var(--black3)}
.acc-head{
  width:100%;background:none;border:none;
  display:flex;justify-content:space-between;align-items:center;
  padding:16px 0;cursor:none;
  font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:rgba(0,0,0,.5);transition:color .2s;
}
.acc-head:hover{color:var(--white)}
.acc-head.open{color:var(--gold)}
.acc-arrow{font-size:10px;color:var(--gold);transition:transform .25s}
.acc-head.open .acc-arrow{transform:rotate(180deg)}
.acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.acc-body.open{max-height:240px}
.acc-body p{
  font-size:12px;line-height:2;color:rgba(0,0,0,.5);
  padding-bottom:16px;font-weight:300;
}

/* Related */
.related-section{
  padding:48px 0;border-top:1px solid var(--black3);
  background:var(--black2);
}
.related-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:2px;background:var(--black3);
  border:1px solid var(--black3);
}
.related-grid .pc{
  background:var(--black2);border:none;
  padding:0 0 16px;border-right:1px solid var(--black3);
}
.related-grid .pc:last-child{border-right:none}
.related-grid .pc-info{padding:12px 12px 0}

/* ── RESPONSIVE ── */
@media(max-width:1024px){
  .listing-grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:768px){
  .listing-header{padding:14px 12px}
  .listing-filters{display:none}
  .filter-tags{padding:10px 12px}
  .listing-grid{grid-template-columns:repeat(2,1fr);padding:1px}
  .breadcrumb{padding:10px 12px}

  .detail-layout{grid-template-columns:1fr}
  .dv-visual{position:relative;top:auto;height:auto}
  .dv-main{aspect-ratio:3/4;height:auto}
  .dv-info{padding:28px 16px}
  .dv-name{font-size:clamp(28px,7vw,40px)}
  .dv-price{font-size:32px}
  .related-grid{grid-template-columns:repeat(2,1fr)}
  .related-grid .pc:nth-child(2n){border-right:none}
  .related-section{padding:32px 0}
}
@media(max-width:480px){
  .listing-grid{grid-template-columns:repeat(2,1fr)}
  .filter-tags{gap:4px}
  .filter-tag{font-size:8.5px;padding:0 10px}
}
</style>
</head>
<body>
<div id="nav-root"></div>

<!-- BREADCRUMB -->
<div class="breadcrumb" id="breadcrumb">
  <a href="index.html">Accueil</a>
  <span class="sep">›</span>
  <span class="current" id="breadCurrent">Annonces</span>
</div>

<!-- ══ LISTING VIEW ══ -->
<div id="listing-view">
  <div class="listing-header">
    <div>
      <span class="listing-title">Annonces</span>
      <span class="listing-count" id="listCount">— 0 annonces</span>
    </div>
    <div class="listing-filters">
      <button class="filter-btn active" onclick="sortProducts('new')">Récentes</button>
      <button class="filter-btn" onclick="sortProducts('city')">Ville A→Z</button>
    </div>
  </div>
  <div class="filter-tags">
    <button class="filter-tag active" onclick="filterCat('all',this)">Tous</button>
    <button class="filter-tag" onclick="filterCat('rencontre',this)">Rencontres</button>
    <button class="filter-tag" onclick="filterCat('sortie',this)">Sorties</button>
    <button class="filter-tag" onclick="filterCat('discussion',this)">Discussion</button>
    <button class="filter-tag" onclick="filterCat('couple',this)">Couples</button>
  </div>
  <div class="listing-grid" id="listing-grid"></div>
</div>

<!-- ══ DETAIL VIEW ══ -->
<div id="detail-view">
  <div class="detail-layout">
    <!-- Visual -->
    <div class="dv-visual">
      <div class="dv-main" id="dv-main">
        <img id="dv-main-img" src="" alt="" style="display:none"/>
        <div class="dv-cloth-wrap">
          <div class="dv-cloth" id="dv-cloth"></div>
        </div>
        <div class="dv-badge" id="dv-badge" style="display:none"></div>
      </div>
      <div class="dv-thumbs" id="dv-thumbs"></div>
    </div>

    <!-- Info -->
    <div class="dv-info">
      <div class="dv-brand" id="dv-brand"></div>
      <h1 class="dv-name" id="dv-name"></h1>
      <div class="dv-price" id="dv-price" style="font-size:14px;font-family:var(--f-mono);color:var(--grey3);margin-bottom:12px"></div>
      <p class="dv-desc" id="dv-desc"></p>

      <div class="dv-sizes" id="dv-tags" style="margin-bottom:20px"></div>

      <div class="dv-cta">
        <button class="btn btn-primary btn-full btn-lg" onclick="contactAnnonce()"><span>Contacter (Premium bientôt)</span></button>
      </div>
      <a href="premium.html" class="btn btn-outline-gold btn-full" style="margin:12px 0 24px"><span>Publier ma propre annonce</span></a>

      <div class="dv-delivery">
        <div class="dv-del-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          Profils majeurs · signalement disponible
        </div>
        <div class="dv-del-item">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/></svg>
          <span id="dv-location"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- RELATED -->
  <section class="related-section">
    <div style="padding:0 24px">
      <div class="section-title-bar">
        <h2>Annonces similaires</h2>
        <a href="product.html" class="see-all">Tout voir</a>
      </div>
    </div>
    <div style="padding:0 24px">
      <div class="related-grid" id="related-grid"></div>
    </div>
  </section>
</div>

<div id="footer-root"></div>

<script src="api.js"></script>
<script src="shared.js"></script>
<script>
document.getElementById('nav-root').innerHTML = buildNavHTML({ activePage: 'annonces' });
document.getElementById('footer-root').innerHTML = buildFooterHTML();
initShared();

const params = new URLSearchParams(location.search);
const pid = params.get('id');
const catFilter = params.get('cat');

let currentAnnonce = null;
let currentAnnonces = [];

function renderListing(list) {
  const g = document.getElementById('listing-grid');
  document.getElementById('listCount').textContent = `— ${list.length} annonce${list.length !== 1 ? 's' : ''}`;
  if (!list.length) {
    g.innerHTML = `<div style="grid-column:1/-1;padding:60px 24px;text-align:center;color:var(--grey3);font-family:var(--f-mono);font-size:12px;letter-spacing:.1em">AUCUNE ANNONCE DANS CETTE CATÉGORIE</div>`;
    return;
  }
  g.innerHTML = list.map((a, i) => renderAnnonceCard(a, i)).join('');
  attachCursorHover(g);
}

function filterCat(cat, btn) {
  document.querySelectorAll('.filter-tag').forEach((b) => b.classList.remove('active'));
  btn.classList.add('active');
  const all = getAllAnnonces().length ? getAllAnnonces() : [...ANNONCES_DEMO];
  if (cat === 'all') currentAnnonces = all;
  else {
    currentAnnonces = all.filter(
      (a) =>
        (a.category && a.category.toLowerCase().includes(cat)) ||
        (a.intention && a.intention.toLowerCase().includes(cat))
    );
  }
  renderListing(currentAnnonces);
}

async function loadDetailById(id) {
  try {
    const { annonce } = await API.getAnnonce(id);
    return annonce;
  } catch {
    return findAnnonce(id);
  }
}

function sortProducts(mode) {
  const sorted = [...currentAnnonces];
  if (mode === 'city') sorted.sort((a, b) => (a.city || '').localeCompare(b.city || ''));
  else sorted.sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
  renderListing(sorted);
}

function loadDetail(a) {
  currentAnnonce = a;
  const idx = getAllAnnonces().findIndex((x) => x.id === a.id);

  document.title = `${SITE.name} — ${a.title}`;
  document.getElementById('breadCurrent').textContent = a.title;

  const mainImg = document.getElementById('dv-main-img');
  const cloth = document.getElementById('dv-cloth');
  const mainEl = document.getElementById('dv-main');
  const img = a.image || (a.photos && a.photos[0]);

  if (img) {
    mainImg.src = img;
    mainImg.alt = a.title;
    mainImg.style.display = 'block';
    cloth.parentElement.style.display = 'none';
    mainEl.style.background = '#111';
  } else {
    mainImg.style.display = 'none';
    cloth.parentElement.style.display = 'flex';
    cloth.style.background = CLOTH_COLORS[idx % CLOTH_COLORS.length];
    mainEl.style.background = BG_GRADS[idx % BG_GRADS.length];
  }

  const badge = document.getElementById('dv-badge');
  badge.textContent = a.category || 'Annonce';
  badge.style.display = 'block';

  const photos = a.photos && a.photos.length ? a.photos : img ? [img] : [];
  const thumbs = document.getElementById('dv-thumbs');
  thumbs.innerHTML = photos
    .map(
      (src, i) => `
    <div class="dv-thumb ${i === 0 ? 'active' : ''}" data-thumb-idx="${i}">
      <img src="${src}" alt="" style="width:100%;height:100%;object-fit:cover"/>
    </div>`
    )
    .join('');
  thumbs.querySelectorAll('[data-thumb-idx]').forEach((el) => {
    el.addEventListener('click', () => {
      const i = Number(el.getAttribute('data-thumb-idx'));
      setThumb(el, photos[i]);
    });
  });

  document.getElementById('dv-brand').textContent = `${a.pseudo} · ${a.age} ans · ${a.gender || ''}`;
  document.getElementById('dv-name').textContent = a.title;
  document.getElementById('dv-price').textContent = `${a.intention || a.category} · Publié le ${a.createdAt || '—'}`;
  document.getElementById('dv-desc').textContent = a.desc;
  document.getElementById('dv-location').textContent = a.city || 'Ville non précisée';

  const tagsEl = document.getElementById('dv-tags');
  tagsEl.innerHTML = [a.city, a.category, a.intention]
    .filter(Boolean)
    .map((t) => `<span class="pc-meta">${t}</span>`)
    .join('');

  const related = getAllAnnonces().filter((x) => x.id !== a.id).slice(0, 4);
  document.getElementById('related-grid').innerHTML = related.map((r, i) => renderAnnonceCard(r, i)).join('');
  attachCursorHover(document.getElementById('related-grid'));
}

function setThumb(el, src) {
  document.querySelectorAll('.dv-thumb').forEach((t) => t.classList.remove('active'));
  el.classList.add('active');
  const mainImg = document.getElementById('dv-main-img');
  mainImg.src = src;
  mainImg.style.display = 'block';
}

function contactAnnonce() {
  if (!AUTH.isLoggedIn()) {
    showToast('Connecte-toi pour contacter (messagerie à venir)', 'error');
    setTimeout(() => { window.location.href = 'compte.html?redirect=' + encodeURIComponent(location.href); }, 600);
    return;
  }
  showToast('Messagerie privée — prochaine étape ✦');
}

/* ── Skeleton loader ── */
function showSkeleton(n = 8) {
  const g = document.getElementById('listing-grid');
  document.getElementById('listCount').textContent = '— chargement…';
  g.innerHTML = Array.from({ length: n }).map(() => `
    <div class="pc" style="pointer-events:none">
      <div class="pc-img" style="background:linear-gradient(90deg,var(--black3) 25%,var(--black4) 50%,var(--black3) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite"></div>
      <div class="pc-info">
        <div style="height:10px;background:var(--black3);margin-bottom:8px;width:60%;border-radius:2px;animation:shimmer 1.4s infinite"></div>
        <div style="height:14px;background:var(--black3);margin-bottom:6px;border-radius:2px;animation:shimmer 1.4s infinite"></div>
        <div style="height:10px;background:var(--black4);width:80%;border-radius:2px;animation:shimmer 1.4s infinite"></div>
      </div>
    </div>`).join('');
}

bootApp().then(async () => {
  if (pid) {
    // ── MODE DÉTAIL ──
    document.getElementById('listing-view').style.display = 'none';
    document.getElementById('detail-view').style.display = 'block';
    const a = await loadDetailById(pid);
    if (a) loadDetail(a);
    else {
      showToast('Annonce introuvable', 'error');
      setTimeout(() => { window.location.href = 'product.html'; }, 1500);
    }
  } else {
    // ── MODE LISTING ──
    document.getElementById('listing-view').style.display = 'block';
    document.getElementById('detail-view').style.display = 'none';
    showSkeleton(8);
    currentAnnonces = getAllAnnonces();
    if (!currentAnnonces.length) currentAnnonces = [...ANNONCES_DEMO];

    if (catFilter && catFilter !== 'all') {
      const matchingBtn = [...document.querySelectorAll('.filter-tag')].find((b) =>
        b.textContent.toLowerCase().includes(catFilter.toLowerCase())
      );
      if (matchingBtn) {
        document.querySelectorAll('.filter-tag').forEach((b) => b.classList.remove('active'));
        matchingBtn.classList.add('active');
      }
      currentAnnonces = currentAnnonces.filter(
        (a) =>
          (a.category && a.category.toLowerCase().includes(catFilter.toLowerCase())) ||
          (a.intention && a.intention.toLowerCase().includes(catFilter.toLowerCase()))
      );
    }
    renderListing(currentAnnonces);
  }
});
</script>
</body>
</html>
