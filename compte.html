<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/jpeg" href="TonuIcon.jpeg"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>tonú Privé — Mon compte</title>
<link rel="stylesheet" href="shared.css"/>
</head>
<body>
<div id="nav-root"></div>

<div class="page-narrow">
  <div id="logged-out-view">
    <div class="form-card">
      <div class="form-tabs">
        <button type="button" class="form-tab active" id="tab-login" onclick="showTab('login')">Connexion</button>
        <button type="button" class="form-tab" id="tab-register" onclick="showTab('register')">Inscription</button>
      </div>

      <div id="panel-login">
        <h1>Connexion</h1>
        <p class="form-sub">Accédez à vos annonces et à votre statut Premium.</p>
        <form onsubmit="return doLogin(event)">
          <div class="field"><label>Email</label><input type="email" id="login-email" required autocomplete="email"/></div>
          <div class="field"><label>Mot de passe</label><input type="password" id="login-password" required autocomplete="current-password"/></div>
          <button class="btn btn-primary btn-full" type="submit"><span>Se connecter</span></button>
        </form>
      </div>

      <div id="panel-register" style="display:none">
        <h1>Inscription</h1>
        <p class="form-sub">Réservé aux personnes majeures (18+). Données stockées localement en mode démo.</p>
        <form onsubmit="return doRegister(event)">
          <div class="field"><label>Pseudo public</label><input type="text" id="reg-pseudo" required maxlength="32"/></div>
          <div class="field"><label>Âge</label><input type="number" id="reg-age" min="18" max="99" required/></div>
          <div class="field"><label>Email</label><input type="email" id="reg-email" required autocomplete="email"/></div>
          <div class="field"><label>Mot de passe</label><input type="password" id="reg-password" required minlength="6" autocomplete="new-password"/></div>
          <button class="btn btn-primary btn-full" type="submit"><span>Créer mon compte</span></button>
        </form>
      </div>
    </div>
  </div>

  <div id="logged-in-view" style="display:none">
    <div class="form-card">
      <span class="user-badge" id="user-premium-badge">Membre</span>
      <h1 id="dash-pseudo">Mon espace</h1>
      <p class="form-sub" id="dash-email"></p>
      <p class="form-sub" id="dash-premium-status"></p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
        <a href="publier.html" class="btn btn-primary btn-full"><span>Publier une annonce</span></a>
        <a href="premium.html" class="btn btn-outline-gold btn-full" id="dash-premium-btn"><span>Pass Premium</span></a>
        <button type="button" class="btn btn-secondary btn-full" onclick="doLogout()"><span>Déconnexion</span></button>
      </div>
    </div>
  </div>
</div>

<div id="footer-root"></div>
<script src="api.js"></script>
<script src="shared.js"></script>
<script>
document.getElementById('nav-root').innerHTML = buildNavHTML({ activePage: '' });
document.getElementById('footer-root').innerHTML = buildFooterHTML();
initShared();
bootApp().then(refreshDashboard);

const redirect = new URLSearchParams(location.search).get('redirect') || 'index.html';

function showTab(which) {
  document.getElementById('panel-login').style.display = which === 'login' ? 'block' : 'none';
  document.getElementById('panel-register').style.display = which === 'register' ? 'block' : 'none';
  document.getElementById('tab-login').classList.toggle('active', which === 'login');
  document.getElementById('tab-register').classList.toggle('active', which === 'register');
}

function refreshDashboard() {
  const u = AUTH.currentUser();
  if (!u) {
    document.getElementById('logged-out-view').style.display = 'block';
    document.getElementById('logged-in-view').style.display = 'none';
    return;
  }
  document.getElementById('logged-out-view').style.display = 'none';
  document.getElementById('logged-in-view').style.display = 'block';
  document.getElementById('dash-pseudo').textContent = u.pseudo;
  document.getElementById('dash-email').textContent = u.email;
  const prem = AUTH.hasPremium();
  document.getElementById('user-premium-badge').textContent = prem ? 'Premium actif' : 'Compte gratuit';
  document.getElementById('dash-premium-status').textContent = prem
    ? `Premium valide jusqu'au ${new Date(u.premiumUntil).toLocaleDateString('fr-FR')}.`
    : 'Consultation gratuite · publication avec photo via abonnement Stripe.';
  if (u.role === 'admin' || u.role === 'moderator') {
    document.getElementById('dash-premium-status').textContent += ' · Accès modération.';
  }
  document.getElementById('dash-premium-btn').style.display = prem ? 'none' : 'inline-flex';
  AUTH.updateNavLabel();
}

async function doLogin(e) {
  e.preventDefault();
  const r = await AUTH.login(document.getElementById('login-email').value, document.getElementById('login-password').value);
  if (!r.ok) { showToast(r.msg, 'error'); return false; }
  AUTH.updateNavLabel();
  showToast('Connecté ✦');
  if (redirect) setTimeout(() => { window.location.href = redirect; }, 500);
  else refreshDashboard();
  return false;
}

async function doRegister(e) {
  e.preventDefault();
  const r = await AUTH.register({
    email: document.getElementById('reg-email').value,
    password: document.getElementById('reg-password').value,
    pseudo: document.getElementById('reg-pseudo').value,
    age: document.getElementById('reg-age').value,
  });
  if (!r.ok) { showToast(r.msg, 'error'); return false; }
  AUTH.updateNavLabel();
  showToast('Compte créé — bienvenue');
  setTimeout(() => { window.location.href = redirect; }, 600);
  return false;
}

function doLogout() {
  AUTH.logout();
  showToast('Déconnecté');
  refreshDashboard();
}

</script>
</body>
</html>
