<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<link rel="icon" type="image/jpeg" href="TonuIcon.jpeg"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>tonú Privé — Publier une annonce</title>
<link rel="stylesheet" href="shared.css"/>
</head>
<body>
<div id="nav-root"></div>

<div class="page-wide">
  <div id="gate-message" class="premium-banner" style="display:none">
    <h3>Publication réservée Premium</h3>
    <p>Connecte-toi et active le Pass Premium (Stripe) pour publier une annonce avec photo.</p>
    <a href="premium.html" class="btn btn-primary btn-sm"><span>Voir le Pass Premium</span></a>
  </div>

  <div class="form-card" id="publish-form-wrap" style="display:none">
    <h1>Publier une annonce</h1>
    <p class="form-sub">Votre annonce sera examinée par la modération avant d’apparaître publiquement.</p>
    <form onsubmit="return submitAnnonce(event)">
      <div class="field"><label>Titre de l'annonce</label><input type="text" id="pub-title" required maxlength="80"/></div>
      <div class="field"><label>Description</label><textarea id="pub-desc" required maxlength="800"></textarea></div>
      <div class="field"><label>Ville</label><input type="text" id="pub-city" required maxlength="60"/></div>
      <div class="field">
        <label>Catégorie</label>
        <select id="pub-cat">
          <option>Rencontre</option>
          <option>Sortie</option>
          <option>Discussion</option>
          <option>Couple</option>
        </select>
      </div>
      <div class="field">
        <label>Intention</label>
        <select id="pub-intention">
          <option>Rencontre</option>
          <option>Rencontre sérieuse</option>
          <option>Sorties</option>
          <option>Discussion</option>
          <option>Couple</option>
        </select>
      </div>
      <div class="field">
        <label>Genre</label>
        <select id="pub-gender">
          <option value="Homme">Homme</option>
          <option value="Femme">Femme</option>
          <option value="Couple">Couple</option>
          <option value="Autre">Autre / Non précisé</option>
        </select>
      </div>
      <div class="field">
        <label>Photo (max 5 Mo, JPG/PNG/WebP)</label>
        <input type="file" id="pub-photo" accept="image/jpeg,image/png,image/webp" required/>
        <div class="photo-preview empty" id="pub-preview">Aperçu de la photo</div>
      </div>
      <button class="btn btn-primary btn-full" type="submit"><span>Envoyer à modération</span></button>
    </form>
  </div>

  <div class="form-card" style="margin-top:24px;display:none" id="my-ads-wrap">
    <h1 style="font-size:28px">Mes annonces</h1>
    <div id="my-ads-list" class="form-sub"></div>
  </div>
</div>

<div id="footer-root"></div>
<script src="api.js"></script>
<script src="shared.js"></script>
<script>
document.getElementById('nav-root').innerHTML = buildNavHTML({ activePage: 'publier' });
document.getElementById('footer-root').innerHTML = buildFooterHTML();
initShared();

let photoFile = null;

function checkAccess() {
  const ok = AUTH.isLoggedIn() && AUTH.hasPremium();
  document.getElementById('gate-message').style.display = ok ? 'none' : 'block';
  document.getElementById('publish-form-wrap').style.display = ok ? 'block' : 'none';
  document.getElementById('my-ads-wrap').style.display = AUTH.isLoggedIn() ? 'block' : 'none';
  renderMyAds();
}

document.getElementById('pub-photo').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) {
    showToast('Image trop lourde (max 5 Mo)', 'error');
    e.target.value = '';
    return;
  }
  photoFile = file;
  const prev = document.getElementById('pub-preview');
  prev.classList.remove('empty');
  prev.innerHTML = `<img src="${URL.createObjectURL(file)}" alt="Aperçu"/>`;
});

async function renderMyAds() {
  const list = document.getElementById('my-ads-list');
  if (!AUTH.isLoggedIn() || !list) return;
  try {
    const { annonces } = await API.myAnnonces();
    if (!annonces.length) {
      list.innerHTML = '<p>Aucune annonce publiée pour le moment.</p>';
      return;
    }
    list.innerHTML = annonces
      .map(
        (a) => `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--black4)">
        <div><strong>${a.title}</strong><br><span style="font-size:11px;color:var(--grey3)">${a.city} · ${a.status} · ${a.createdAt}</span></div>
        <div style="display:flex;gap:8px">
          <a href="product.html?id=${a.id}" class="btn btn-sm btn-secondary"><span>Voir</span></a>
          <button type="button" class="btn btn-sm btn-secondary" onclick="deleteAd('${a.id}')"><span>Supprimer</span></button>
        </div>
      </div>`
      )
      .join('');
  } catch (e) {
    list.innerHTML = `<p>${e.message}</p>`;
  }
}

async function deleteAd(id) {
  try {
    await API.deleteAnnonce(id);
    showToast('Annonce supprimée');
    await fetchAllAnnonces(true);
    renderMyAds();
  } catch (e) {
    showToast(e.message, 'error');
  }
}

async function submitAnnonce(e) {
  e.preventDefault();
  if (!AUTH.isLoggedIn()) {
    showToast('Connecte-toi', 'error');
    return false;
  }
  if (!AUTH.hasPremium()) {
    requirePremium('publier.html');
    return false;
  }
  if (!photoFile) {
    showToast('Ajoute une photo', 'error');
    return false;
  }
  const fd = new FormData();
  fd.append('title', document.getElementById('pub-title').value.trim());
  fd.append('description', document.getElementById('pub-desc').value.trim());
  fd.append('city', document.getElementById('pub-city').value.trim());
  fd.append('category', document.getElementById('pub-cat').value);
  fd.append('intention', document.getElementById('pub-intention').value);
  fd.append('gender', document.getElementById('pub-gender').value);
  fd.append('photos', photoFile);
  try {
    const { annonce, message } = await API.createAnnonce(fd);
    showToast(message || 'Annonce envoyée ✦');
    await fetchAllAnnonces(true);
    setTimeout(() => { window.location.href = 'product.html?id=' + annonce.id; }, 700);
  } catch (err) {
    showToast(err.message || 'Erreur publication', 'error');
  }
  return false;
}

bootApp().then(() => {
  if (!AUTH.isLoggedIn()) {
    document.getElementById('gate-message').style.display = 'block';
    document.getElementById('gate-message').innerHTML = `
      <h3>Connexion requise</h3>
      <p>Crée un compte ou connecte-toi, puis active le Pass Premium pour publier.</p>
      <a href="compte.html?redirect=publier.html" class="btn btn-primary btn-sm"><span>Se connecter</span></a>`;
    document.getElementById('publish-form-wrap').style.display = 'none';
    document.getElementById('my-ads-wrap').style.display = 'none';
  } else {
    checkAccess();
  }
});
</script>
</body>
</html>
