services:
  app:
    build: .
    container_name: tonu-prive
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_DIR: /app/data
      UPLOADS_DIR: /app/uploads
    ports:
      # Exposé uniquement en local : placez un reverse proxy HTTPS devant.
      - "127.0.0.1:3000:3000"
    volumes:
      - tonu-data:/app/data
      - tonu-uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  tonu-data:
  tonu-uploads:
